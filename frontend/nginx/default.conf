map $http_x_forwarded_host $proxy_x_forwarded_host {
    default $http_x_forwarded_host;
    "" $host;
}

map $http_x_forwarded_port $proxy_x_forwarded_port {
    default $http_x_forwarded_port;
    "" $server_port;
}

map $http_x_forwarded_proto $proxy_x_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

map $http_x_real_ip $proxy_x_real_ip {
    default $http_x_real_ip;
    "" $remote_addr;
}

map $http_x_forwarded_for $proxy_x_forwarded_for {
    default $http_x_forwarded_for;
    "" $remote_addr;
}

log_format frontend_forwarded '$proxy_x_real_ip - $remote_user [$time_local] "$request" '
                              '$status $body_bytes_sent "$http_referer" '
                              '"$http_user_agent" "$http_x_forwarded_for"';

server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    client_max_body_size 10m;
    access_log /var/log/nginx/access.log frontend_forwarded;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_cache off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $proxy_x_real_ip;
        proxy_set_header X-Forwarded-For $proxy_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $proxy_x_forwarded_host;
        proxy_set_header X-Forwarded-Port $proxy_x_forwarded_port;
        proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
    }

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files /index.html =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /index.html;
    }
}
