name: evaluation-protocol

services:
  postgres:
    image: "postgres:${POSTGRES_VERSION:-16-alpine}"
    container_name: evaluation-protocol-postgres
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-evaluation}"
      POSTGRES_USER: "${POSTGRES_USER:-evaluation}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-evaluation}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: evaluation-protocol-api
    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-evaluation}:${POSTGRES_PASSWORD:-evaluation}@postgres:5432/${POSTGRES_DB:-evaluation}"
      SESSION_COOKIE_NAME: "${SESSION_COOKIE_NAME:-s1}"
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-true}"
      SESSION_COOKIE_SAMESITE: "${SESSION_COOKIE_SAMESITE:-lax}"
      SESSION_TTL_MINUTES: "${SESSION_TTL_MINUTES:-360}"
      SESSION_CLEANUP_INTERVAL_MINUTES: "${SESSION_CLEANUP_INTERVAL_MINUTES:-60}"
      MICROSOFT_TENANT_ID: "${MICROSOFT_TENANT_ID:-organizations}"
      MICROSOFT_CLIENT_ID: "${MICROSOFT_CLIENT_ID:-}"
      MICROSOFT_CLIENT_SECRET: "${MICROSOFT_CLIENT_SECRET:-}"
      MICROSOFT_REDIRECT_PATH: "${MICROSOFT_REDIRECT_PATH:-/api/v1/auth/callback/microsoft}"
      MICROSOFT_SCOPES: '${MICROSOFT_SCOPES:-["openid","email","User.Read"]}'
      INITIALIZATION_EMAIL: "${INITIALIZATION_EMAIL:-bootstrap@example.com}"
      COMPANY_EMAIL_DOMAIN: "${COMPANY_EMAIL_DOMAIN:-example.com}"
      FRONTEND_SUCCESS_URL: "${FRONTEND_SUCCESS_URL:-/}"
      FRONTEND_FAILURE_URL: "${FRONTEND_FAILURE_URL:-/login}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_LOGIN_EYEBROW: "${VITE_LOGIN_EYEBROW:-Evaluation Protocol}"
    container_name: evaluation-protocol
    expose:
      - "8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/nginx-health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
