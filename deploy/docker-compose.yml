name: evaluation-protocol

services:
  postgres:
    image: "postgres:${POSTGRES_VERSION:?POSTGRES_VERSION is required}"
    container_name: ${EVALUATION_PROTOCOL_POSTGRES_CONTAINER_NAME:?EVALUATION_PROTOCOL_POSTGRES_CONTAINER_NAME is required}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: ${EVALUATION_PROTOCOL_BACKEND_CONTAINER_NAME:?EVALUATION_PROTOCOL_BACKEND_CONTAINER_NAME is required}
    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}"
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:?SESSION_COOKIE_NAME is required}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:?SESSION_COOKIE_SECURE is required}
      SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE:?SESSION_COOKIE_SAMESITE is required}
      SESSION_TTL_MINUTES: ${SESSION_TTL_MINUTES:?SESSION_TTL_MINUTES is required}
      SESSION_CLEANUP_INTERVAL_MINUTES: ${SESSION_CLEANUP_INTERVAL_MINUTES:?SESSION_CLEANUP_INTERVAL_MINUTES is required}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:?MICROSOFT_TENANT_ID is required}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:?MICROSOFT_CLIENT_ID is required}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:?MICROSOFT_CLIENT_SECRET is required}
      MICROSOFT_REDIRECT_PATH: ${MICROSOFT_REDIRECT_PATH:?MICROSOFT_REDIRECT_PATH is required}
      MICROSOFT_SCOPES: ${MICROSOFT_SCOPES:?MICROSOFT_SCOPES is required}
      INITIALIZATION_EMAIL: ${INITIALIZATION_EMAIL:?INITIALIZATION_EMAIL is required}
      COMPANY_EMAIL_DOMAIN: ${COMPANY_EMAIL_DOMAIN:?COMPANY_EMAIL_DOMAIN is required}
      FRONTEND_SUCCESS_URL: ${FRONTEND_SUCCESS_URL:?FRONTEND_SUCCESS_URL is required}
      FRONTEND_FAILURE_URL: ${FRONTEND_FAILURE_URL:?FRONTEND_FAILURE_URL is required}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_LOGIN_EYEBROW: ${VITE_LOGIN_EYEBROW:?VITE_LOGIN_EYEBROW is required}
    container_name: ${EVALUATION_PROTOCOL_CONTAINER_NAME:?EVALUATION_PROTOCOL_CONTAINER_NAME is required}
    expose:
      - "8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/nginx-health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
